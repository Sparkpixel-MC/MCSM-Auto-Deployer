[package]
name = "mcsm-auto-deployer"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Material Design 3 deployment dashboard for Minecraft artifacts from GitHub, Modrinth, CurseForge and Spigot via MCSManager"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
bytes = "1.7"
futures-util = "0.3"
mime_guess = "2.0"
parking_lot = "0.12"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "rustls-tls-native-roots", "stream", "system-proxy"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
